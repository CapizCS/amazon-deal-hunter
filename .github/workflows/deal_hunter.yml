name: Deal Hunter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v7

      - name: Configura Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Aggiorna storico prezzi
        env:
          PARSE_API_KEY: ${{ secrets.PARSE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=========================================="
          echo "AGGIORNAMENTO STORICO PREZZI"
          echo "=========================================="
          python -u price_tracker.py

      - name: Salva storico e rotazione
        run: |
          echo "=========================================="
          echo "SALVATAGGIO STORICO"
          echo "=========================================="

          git config user.name "Deal Hunter"
          git config user.email "deal-hunter@users.noreply.github.com"

          git add price_history.json search_rotation.json

          if git diff --cached --quiet; then
            echo "Nessuna modifica allo storico da salvare."
          else
            git commit -m "Aggiorna storico e rotazione"
            git push
            echo "Storico e rotazione salvati."
          fi

      - name: Avvia Deal Hunter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          echo "=========================================="
          echo "AVVIO DEAL HUNTER"
          echo "=========================================="

          echo "Controllo file:"
          ls -lh deal_hunter.py price_history.json

          echo "Esecuzione Deal Hunter..."
          python -u deal_hunter.py

          echo "=========================================="
          echo "DEAL HUNTER TERMINATO"
          echo "=========================================="
