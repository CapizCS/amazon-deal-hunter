name: Deal Hunter

on:
  workflow_dispatch:
  
permissions:
  contents: write
  
jobs:
  hunt:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il progetto
        uses: actions/checkout@v7

      - name: Configura Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Aggiorna storico prezzi
        run: python price_tracker.py

      - name: Salva storico aggiornato
        run: |
          git config user.name "Deal Hunter"
          git config user.email "deal-hunter@users.noreply.github.com"
          git add price_history.json
          git diff --cached --quiet || git commit -m "Aggiorna storico prezzi"
          git push


      - name: Test Parse Amazon
        env:
          PARSE_API_KEY: ${{ secrets.PARSE_API_KEY }}
        run: python parse_test.py
      - name: Avvia Deal Hunter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python deal_hunter.py
